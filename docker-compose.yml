services:
  polymarket:
    build: .
    container_name: polymarket
    restart: unless-stopped
    ports:
      - "8019:8019"
    volumes:
      - polymarket_data:/app/data
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/polymarket.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

volumes:
  polymarket_data:
    driver: local
