<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - Polymarket</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
  h1 { font-size: 24px; margin-bottom: 24px; color: #7c3aed; text-align: center; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #a0a0b0; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; background: #0f0f1a; border: 1px solid #2a2a4a; border-radius: 8px; color: #e0e0e0; font-size: 14px; outline: none; }
  input:focus { border-color: #7c3aed; }
  button { width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  button:hover { background: #6d28d9; }
  .error { color: #ef4444; font-size: 13px; margin-top: 8px; text-align: center; display: none; }
  .success { color: #34d399; font-size: 13px; margin-top: 8px; text-align: center; display: none; }
  .hint { font-size: 12px; color: #6b7280; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Polymarket</h1>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button onclick="login()">登录</button>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <div class="hint" id="hint">首次使用将自动创建管理员账户</div>
</div>
<script>
const API = '';
async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('success');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password}),
    });
    const d = await r.json();
    if (!r.ok) { errorEl.textContent = d.detail || '登录失败'; errorEl.style.display = 'block'; return; }
    if (d.first_time) {
      successEl.textContent = '管理员账户创建成功，正在进入...';
      successEl.style.display = 'block';
    }
    localStorage.setItem('pm_token', d.token || '');
    setTimeout(() => { window.location.href = '/'; }, d.first_time ? 1500 : 200);
  } catch(e) {
    errorEl.textContent = '请求失败: ' + e.message;
    errorEl.style.display = 'block';
  }
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
